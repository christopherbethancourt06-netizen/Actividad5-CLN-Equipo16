# Integración continua del laboratorio de la Unidad 5 (CLN).
# Etapas: checkout → Python → dependencias → Ruff → pytest con cobertura >= 80 % → compilación de src/.
# El pipeline verifica el build (compileall); no realiza despliegue productivo.
name: CI Business Logic

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ruff
        run: python -m ruff check src tests

      - name: Pytest con cobertura mínima del 80 %
        run: python -m pytest -v --cov=src --cov-report=term-missing --cov-report=html --cov-fail-under=80

      - name: Compilar src/
        run: python -m compileall -q src

      - name: Publicar el reporte HTML de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov-python-${{ matrix.python-version }}
          path: htmlcov/
          if-no-files-found: ignore
