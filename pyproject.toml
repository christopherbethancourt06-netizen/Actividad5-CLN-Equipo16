[tool.pytest.ini_options]
testpaths = ["tests"]
# La raíz del proyecto se agrega a sys.path para que `pytest` (sin `python -m`) encuentre el paquete `src`.
pythonpath = ["."]
# Una conexión o sesión sin cerrar hace fallar la suite (limpieza de recursos entre pruebas).
filterwarnings = ["error::ResourceWarning", "error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["src"]

[tool.ruff]
line-length = 100
# El proyecto de Eventos Nova incluido en pia_eventos_nova/ tiene su propia configuración (tests_u5/ruff.toml).
extend-exclude = ["pia_eventos_nova"]
